<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="An interactive WebGL ripple study, inspired by Olivier Larose.">
  <title>Ripple Shader — Interactive Study</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script defer src="assets.js"></script>
  <script defer src="ripple-trail.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="toolbar">
    <a class="credit" href="https://blog.olivierlarose.com/demos/ripple-shader" target="_blank" rel="noopener noreferrer" title="查看 Olivier Larose 原作">Ripple Study <span aria-hidden="true">↗</span></a>
    <div class="tools">
      <label class="sr-only" for="effect">波纹模式</label>
      <select id="effect">
        <option value="classic">Ripple Shader</option>
        <option value="soft">Soft Ripple</option>
        <option value="liquid">Liquid Distortion</option>
      </select>
      <button id="info" class="icon-button" aria-label="查看效果说明" title="效果说明"><svg width="20" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="m8 7-5 5 5 5m8-10 5 5-5 5"/></svg></button>
    </div>
    <button id="motion" class="motion-button" aria-label="暂停波纹" aria-pressed="false" title="暂停波纹"><span class="orb" aria-hidden="true"></span></button>
  </header>
  <main id="stage" aria-label="互动水波画廊，移动鼠标或手指产生波纹">
    <div class="fallback" aria-hidden="true"><img id="rock" alt=""><img id="flower" alt=""><img id="portrait" alt=""></div>
    <canvas id="canvas" aria-label="三张黑白图片：巨石与人、花朵、人像。移动指针可使画面产生水波变形。"></canvas>
    <p id="status" class="status" role="status">Loading textures<span class="loading-dot">…</span></p>
    <p id="hint" class="hint">移动鼠标，泛起涟漪 <span>MOVE TO DISTURB</span></p>
    <noscript><p class="status">请启用 JavaScript 以体验水波效果。</p></noscript>
  </main>
  <dialog id="about" aria-labelledby="about-title">
    <div class="dialog-top"><span class="eyebrow">AN INTERACTIVE STUDY / 001</span><button id="close-info" class="icon-button close" aria-label="关闭说明">×</button></div>
    <h1 id="about-title">A moment.<br>A ripple.</h1>
    <p>移动鼠标，或者在触屏上滑动。每一次移动都会留下逐渐扩散、旋转、消散的波纹，让图像与边界一起流动。</p>
    <dl><div><dt>模式</dt><dd>顶部切换经典、柔和与强烈水波</dd></div><div><dt>暂停</dt><dd>点击右上角色球，或按空格键</dd></div><div><dt>重置</dt><dd>按 R 清除全部波纹</dd></div></dl>
    <p class="attribution">效果研究与独立实现，灵感及示例素材来自 <a href="https://blog.olivierlarose.com/demos/ripple-shader" target="_blank" rel="noopener noreferrer">Olivier Larose ↗</a>。非官方作品；图片仅供演示学习，商用前请替换为已获授权的素材。</p>
    <button id="replay" class="replay">试试一圈涟漪 <span aria-hidden="true">↗</span></button>
  </dialog>
</body>
</html>
